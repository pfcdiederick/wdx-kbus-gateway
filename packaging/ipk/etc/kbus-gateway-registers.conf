# Registers: named values that containers share through the wdx data layer.
# They never touch the KBUS. Apply changes with: /etc/init.d/kbus-gateway restart
# This file is kept on package updates.
#
#   <Name>  <type>  [default]  [persistent]
#
#   Name        segments of A-Z a-z 0-9 _ separated by '/', each starting with a
#               letter, max 40 characters, not case sensitive (must be unique)
#   type        boolean | int32 | uint32 | float64 | string (max 127 bytes UTF-8)
#   default     JSON value, strings in double quotes; omitted = false / 0 / ""
#   persistent  the value survives a restart (stored in REGISTER_STORE)
#
# wdx path: Registers/<Name>/Value, id: 0-0-registers-<name, '/' -> '-', lower case>-value
#   Pump1/Setpoint  ->  Registers/Pump1/Setpoint/Value  ->  0-0-registers-pump1-setpoint-value
#
# Examples (remove the '#' to use them):
# Pump1/Setpoint   float64  12.5   persistent
# Line/Running     boolean
# Batch/Number     uint32   0      persistent
# Recipe/Name      string   ""     persistent
# Vision/Result    int32
#
# Text CODESYS -> container and answer container -> CODESYS
# (FB_WdxWriteString / FB_WdxReadString, docker/example-client respond()):
# Codesys/Message  string  ""
# Python/Response  string  ""
