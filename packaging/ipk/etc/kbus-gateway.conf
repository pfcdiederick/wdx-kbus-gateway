# kbus-gateway settings (native installation).
# Read by /etc/init.d/kbus-gateway; apply changes with:
#   /etc/init.d/kbus-gateway restart
# All variables: docs/MANUAL.md, section 10. This file is kept on package updates.

# Unix socket for containers (main interface). Mount the DIRECTORY into a container:
#   docker run -v /run/kbus-gateway:/run/kbus-gateway ...
WDX_SOCKET=/run/kbus-gateway/wdx.sock   # empty = off
WDX_SOCKET_MODE=0660    # who may connect (file permissions)
WDX_SOCKET_GROUP=       # optional group that may connect, e.g. a group for container users

# TCP listener: for containers with --network host (CODESYS) and the web page
HTTP_ENABLE=1
HTTP_BIND=127.0.0.1     # 127.0.0.1 = this controller only; 0.0.0.0 = all networks (web page from a PC)
HTTP_PORT=8000          # not 80/443 (WBM)

# Both listeners
HTTP_WRITE_ENABLE=1     # 0 = KBUS outputs read-only (PATCH answers 403); registers stay writable
HTTP_LOG=1              # 0 none, 1 writes that change an output, 2 every request (testing only)
HTTP_PRIORITY=30        # SCHED_FIFO priority of the server threads (below KBUS_PRIORITY), 0 = normal
WDX_MAX_CLIENTS=16      # connections served at the same time (more: 503)
WDX_CLIENT_TIMEOUT_MS=5000   # time a client has to send its request

# Registers shared between containers (declared in REGISTER_FILE)
REGISTER_FILE=/etc/kbus-gateway-registers.conf
REGISTER_STORE=/home/kbus-gateway/registers.dat   # persistent values; empty = not stored
REGISTER_SAVE_S=10      # persistent values are written at most every N seconds (and at stop)

# KBUS cycle
KBUS_CYCLE_MS=5         # 1..40 ms; check KBus/MaxCycleDuration and KBus/Overruns after a change.
                        # A value written to KBus/CycleTime is kept in KBUS_SETTINGS_STORE and wins.
#KBUS_SETTINGS_STORE=/home/kbus-gateway/kbus-settings.conf   # "" = do not store it
KBUS_PRIORITY=40        # SCHED_FIFO real-time priority of the KBUS cycle, 0 = off

# Logging: syslog (/var/log/messages, ident kbus-gateway)
LOG_TARGET=syslog
