; ---------------------------------------------------------------------------
; WDX (kbus-gateway) -> IEC 60870-5-104 gateway configuration
; ---------------------------------------------------------------------------
; Lines starting with ; or # are comments.

[general]
; DEBUG, INFO, WARNING, ERROR
log_level = INFO
; Poll interval of the kbus-gateway in milliseconds (minimum 10).
; One request per poll reads all inputs (one KBus snapshot, a few hundred µs).
poll_ms = 100

[wdx]
; kbus-gateway (wdx data layer). Default: its Unix socket; the container needs
;   -v /run/kbus-gateway:/run/kbus-gateway
socket = /run/kbus-gateway/wdx.sock
; Or TCP instead of the socket (container with --network host): set host
; host = 127.0.0.1
port = 8000
; Time-out per request in seconds
timeout = 1.0

[iec104]
; IEC 104 server (slave / outstation) the SCADA connects to
ip = 0.0.0.0
port = 2404
; Maximum number of IEC 104 clients (0 = unlimited)
max_connections = 0
; Common address of ASDU (station address)
common_address = 1
; 0 = send only spontaneously on a change
; >0 = also send cyclically every x milliseconds
report_ms = 0

[points]
; <signal> = <IOA>
; DI<n> = digital input n (1-based) -> M_SP_TB_1 (single point with time tag)
DI1 = 1
DI2 = 2
DI3 = 3
DI4 = 4
