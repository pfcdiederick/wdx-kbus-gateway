# lighttpd webserver configuration file of the controller:
# kbus-manager (the KBUS dashboard) under http(s)://<controller>/kbus/
#
# Installed by tools/deploy-docker.sh --manager as /etc/lighttpd/apps.confd/kbus.conf
# (included by /etc/lighttpd/lighttpd.conf like the WBM and WebVisu configs).
# __MG_PORT__ is replaced by the port of the manager container on 127.0.0.1.
#
# The path is forwarded unchanged: the manager strips the prefix itself and
# redirects /kbus to /kbus/ (MGMT_PREFIX). HTTP follows the mode set in the WBM
# (Ports and Services > Web services): in "HTTPS only" mode the firmware
# redirects http://<controller>/kbus to https://<controller>/kbus, like the WBM.

$SERVER["socket"] =~ default_sockets {
    $HTTP["url"] =~ "^/kbus(/|\?|$)" {
        # the page uses inline styles and scripts
        setenv.set-response-header  = (
            "Content-Security-Policy" => "default-src 'self' 'unsafe-inline'; img-src 'self' data:",
            "X-Frame-Options" => "SAMEORIGIN"
        )
        setenv.set-response-header += var.response_header_policy_common

        proxy.server = ( "" => (( "host" => "127.0.0.1", "port" => __MG_PORT__ )) )
        proxy.forwarded = ( "for" => 1, "proto" => 1, "host" => 1 )
    }
    # live values (Server-Sent Events): pass every message on at once, do not buffer
    $HTTP["url"] =~ "^/kbus/api/events" {
        server.stream-response-body = 2
    }
}
